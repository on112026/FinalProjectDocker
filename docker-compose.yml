version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: crmlite_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: crmlite
      POSTGRES_USER: crmlite_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crmlite_user -d crmlite"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crmlite_network

  web:
    build:
      context: ./KursFinalProject
      dockerfile: ../Dockerfile
    container_name: crmlite_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 crmlite.wsgi:application"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DJANGO_SETTINGS_MODULE=crmlite.settings
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_NAME=crmlite
      - DATABASE_USER=crmlite_user
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-change_me_in_production}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - ./KursFinalProject:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crmlite_network

  nginx:
    image: nginx:alpine
    container_name: crmlite_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - crmlite_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  crmlite_network:
    driver: bridge